limit_req_zone $binary_remote_addr zone=blog_req:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=blog_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name your-server-ip;

    # 站点真实目录：即使某条 location 写错，映射上限也只是这个目录
    root /blog;

    # 安全头（server 级）。注意：nginx 的 add_header 是「层级覆盖」不是合并——
    # 任何 location 里一旦出现 add_header（下面两个缓存 location 就有），
    # server 级这几行在那儿就全部失效。所以两个正则 location 里原样重复了。
    # 刻意不抽 include 片段：单文件自包含，服务器上只需传这一个文件
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # CSP 说明：VitePress 水合有内联脚本、组件有内联样式，script/style 必须
    # 开 unsafe-inline（纯 'self' 会白屏）；其余指令仍是有效防线——object-src
    # 禁插件、base-uri 禁 <base> 注入、form-action 限表单提交、frame-ancestors
    # 禁被嵌入（与上面 X-Frame-Options 双保险，CSP 方覆盖现代浏览器）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # 响应头/错误页不暴露 nginx 版本号
    server_tokens off;

    # 纯静态站不接受请求体，超过 1m 直接拒绝，防异常大包消耗资源
    client_max_body_size 1m;

    # 基础限流：20r/s + burst 40（笔记页首屏一次拉 10~30 个静态资源，burst
    # 给足不误伤正常浏览），nodelay 即时处理；单 IP 并发连接限 20。
    # 扫描器/爬虫会收到 503，正常用户无感
    limit_req zone=blog_req burst=40 nodelay;
    limit_conn blog_conn 20;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 除 /blog/ 外一律 404
    location / {
        return 404;
    }

    # /blog 补上结尾斜杠
    location = /blog {
        return 301 /blog/;
    }

    # 页面入口：alias 恒等映射（URL /blog/x ↔ 磁盘 /blog/x）。
    # 不用 rewrite 去前缀——rewrite 后 index 的内部重定向 URI 变成
    # /index.html，会重新走 location 匹配掉进 location / 的 404
    location /blog/ {
        alias /blog/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # 带 hash 的静态资源：内容变文件名就变，可以永久缓存
    location ~* ^/blog/.*\.(js|css|woff2?|png|jpe?g|gif|svg|webp|ico)$ {
        # 剥掉 /blog 前缀后由 server 级 root /blog 映射（前缀-抵消是刻意设计）；
        # try_files 显式写出来，不依赖「root 恰好拼对」的默认行为
        rewrite ^/blog/(.*)$ /$1 break;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # 重复声明：见 server 级注释（add_header 层级覆盖）
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # HTML 不缓存：每次 deploy 立即生效
    location ~* ^/blog/.*\.html$ {
        rewrite ^/blog/(.*)$ /$1 break;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        # 重复声明：见 server 级注释（add_header 层级覆盖）
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
